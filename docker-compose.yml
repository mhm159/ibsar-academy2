# ============================================================
# Manhal Academy — production stack
#
#   app    : Next.js (Next 16) on :3000 — SQLite + uploads
#   socket : socket.io classroom service on :3003
#   caddy  : public reverse proxy on :80 (HTTP)
#
# Setup:
#   cp .env.example .env          # then fill secrets
#   docker compose up -d --build
#
# Data persists in named volumes:
#   manhal-db      -> /data/custom.db       (SQLite)
#   manhal-uploads -> /app/public/uploads   (uploaded files)
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Absolute path on the persistent volume
      DATABASE_URL: file:/data/custom.db
    volumes:
      - manhal-db:/data
      - manhal-uploads:/app/public/uploads
    restart: unless-stopped
    depends_on:
      - socket
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/site/settings').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  socket:
    build:
      context: ./mini-services/classroom-service
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      # engine.io path is '/'; the polling handshake returns 200 when healthy
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/?EIO=4&transport=polling').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - app
      - socket

volumes:
  manhal-db:
  manhal-uploads:
  caddy-data:
  caddy-config:
