<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dars Academy Logo">
  <defs>
    <linearGradient id="manhalGold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8D488"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#A8842F"/>
    </linearGradient>
    <linearGradient id="manhalAzure" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A9DD8"/>
      <stop offset="1" stop-color="#1B6CA8"/>
    </linearGradient>
  </defs>
  <!-- Outer Eye of Horus shape -->
  <path d="M4 32 C 16 16, 48 16, 60 32 C 48 48, 16 48, 4 32 Z" fill="url(#manhalGold)" opacity="0.18"/>
  <path d="M8 32 C 18 20, 46 20, 56 32 C 46 44, 18 44, 8 32 Z" stroke="url(#manhalGold)" stroke-width="2.5" fill="none"/>
  <!-- Iris -->
  <circle cx="32" cy="32" r="10" fill="url(#manhalAzure)"/>
  <circle cx="32" cy="32" r="10" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
  <!-- Pupil -->
  <circle cx="32" cy="32" r="4.5" fill="#0F1923"/>
  <!-- Highlight -->
  <circle cx="34.5" cy="29.5" r="1.6" fill="#FFE66D"/>
  <!-- Hieroglyph accent (ankh-like dot above) -->
  <circle cx="32" cy="10" r="2" fill="url(#manhalGold)"/>
  <line x1="32" y1="12" x2="32" y2="18" stroke="url(#manhalGold)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
